name: Release

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]

permissions:
  contents: write
  id-token: write

concurrency:
  group: ui-design-library-release
  queue: max

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify tested commit is current main
        env:
          QUALITY_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$QUALITY_HEAD_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$QUALITY_HEAD_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - name: Enable pnpm via Corepack
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium and WebKit
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Reject aggregated breaking-change bodies
        run: pnpm release:preflight

      - name: Verify release policy self-tests
        run: pnpm run release:preflight:selftest

      - name: Inspect packed artifact
        # package.json intentionally stays on a prerelease development version;
        # npm requires an explicit non-latest tag even for a publish dry run.
        run: npm publish --dry-run --ignore-scripts --tag development

      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HUSKY: '0'
        run: pnpm exec semantic-release
